name: Deploy PROD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: smart-data-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy Smart Data PROD
    runs-on: ubuntu-latest
    environment: production

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PROD dashboard
        run: |
          python scripts/generate_dashboard.py \
            --source-file dashboards/smart_data_dashboard_dev.lvdash.json \
            --target-file dashboards/smart_data_dashboard_prod.lvdash.json \
            --source-catalog "${{ vars.DEV_CATALOG }}" \
            --target-catalog "${{ vars.PROD_CATALOG }}" \
            --schema "${{ vars.SCHEMA_NAME }}"

      - name: Verify generated dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dashboards/smart_data_dashboard_prod.lvdash.json")

          if not path.exists():
              raise RuntimeError("No se generó el dashboard PROD.")

          content = path.read_text(encoding="utf-8")

          dev = "${{ vars.DEV_CATALOG }}.${{ vars.SCHEMA_NAME }}."
          prod = "${{ vars.PROD_CATALOG }}.${{ vars.SCHEMA_NAME }}."

          if dev in content:
              raise RuntimeError(
                  f"El dashboard PROD todavía contiene referencias DEV: {dev}"
              )

          if prod not in content:
              raise RuntimeError(
                  f"El dashboard no contiene referencias PROD: {prod}"
              )

          print("Dashboard PROD validado correctamente.")
          PY

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD bundle
        run: databricks bundle validate --target prod

      - name: Deploy PROD bundle
        run: databricks bundle deploy --target prod